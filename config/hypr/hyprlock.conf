input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(102,102,102,0.50)
    inner_color = rgba(40,42,46,0.80)
    font_color = rgb(197,200,198)

    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Enter Password
    hide_input = false

    position = 0, -65
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"

    color = rgba(129,162,190,0.95)
    font_size = 40
    font_family = JetBrainsMono Nerd Font Bold

    position = 50, -40
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"

    color = rgba(181,189,104,0.90)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 50, -120
    halign = left
    valign = top
}

