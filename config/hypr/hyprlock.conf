    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = Krish

    color = rgba(197,200,198,0.95)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 15
    halign = center
    valign = center
