background {
    monitor =
    path = screenshot

    blur_passes = 4
    contrast = 1
    brightness = 0.55
    vibrancy = 0.05
    vibrancy_darkness = 0.15
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

input-field {
    monitor =
    size = 180, 55

    outline_thickness = 2

    dots_size = 0.4
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(6e94b2ee)

    inner_color = rgba(252530dd)

    font_color = rgb(cdcdcd)

    font_family = JetBrainsMono Nerd Font Mono

    fade_on_empty = true
    rounding = 12

    check_color = rgb(8ba9c1)

    fail_text = Wrong password
    fail_color = rgb(d8647e)

    placeholder_text = Enter password
    placeholder_color = rgb(606079)

    hide_input = false

    position = 0, -580
    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:1000] echo "$(date +'%H:%M')"

    color = rgba(cdcdcdee)

    font_size = 300
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = center
}
