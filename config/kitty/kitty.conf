font_family JetBrainsMono Nerd Font
font_size 14

hide_window_decorations yes

window_padding_width 12

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.08 0.3

scrollback_lines 50000

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no
command_on_bell none

confirm_os_window_close 0

copy_on_select yes
strip_trailing_spaces smart
mouse_hide_wait 2.0
remember_window_size no

sync_to_monitor yes
repaint_delay 10
input_delay 3

tab_bar_style powerline
tab_powerline_style slanted

background_opacity 0.95
background_blur 32

foreground            #e6d6ac
background            #2A2426

selection_foreground  #2A2426
selection_background  #d8caac

cursor                #e6d6ac
cursor_text_color     #2A2426

url_color             #89beba

active_tab_foreground   #2A2426
active_tab_background   #d8caac
inactive_tab_foreground #e6d6ac
inactive_tab_background #312b2d

color0   #242021
color8   #5b5b5b

color1   #e68183
color9   #e68183

color2   #87af87
color10  #87c095

color3   #d9bb80
color11  #d8caac

