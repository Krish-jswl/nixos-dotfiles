    position = 0, 0
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/krishj/Pictures/pfp/pfp.jpeg

    border_color = rgb(129,162,190) # Blue
    border_size = 2

    size = 100
    rounding = -1
